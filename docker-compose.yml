services:
  rust-academy:
    build: .
    container_name: rust-academy
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8011
      - RA_DB=/app/data/rust-academy.db
      - RA_ADMIN_PASSWORD=change_me_super_secret # Свой пароль
    volumes:
      - ./data:/app/data
    networks:
      - npm_network

networks:
  npm_network:
    external: true
    name: npm_network